[package]
name = "language_extension"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/language_extension.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
collections.workspace = true
extension.workspace = true
futures.workspace = true
fs.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
lsp.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
util.workspace = true
ztracing.workspace = true

# The `#[cfg(test)]` module in `extension_lsp_adapter.rs` imports `util::test`,
# which `util` gates behind `any(test, feature = "test-support")`. Nothing else in
# this crate turned that feature on, so `cargo {test,clippy} -p language_extension
# --all-targets` did not compile at all.
[dev-dependencies]
util = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-machete]
ignored = ["tracing"]
