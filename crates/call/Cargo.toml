[package]
name = "call"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/call.rs"
doctest = false

[features]
test-support = [
    "client/test-support",
    "collections/test-support",
    "gpui/test-support",
    "livekit_client/test-support",
    "project/test-support",
    "util/test-support",
    "workspace/test-support"
]

[dependencies]
anyhow.workspace = true
audio.workspace = true
client.workspace = true
collections.workspace = true
fs.workspace = true
futures.workspace = true
feature_flags.workspace = true
gpui = { workspace = true, features = ["screen-capture"] }
gpui_tokio.workspace = true
language.workspace = true
livekit_client.workspace = true
log.workspace = true
postage.workspace = true
project.workspace = true
serde.workspace = true
settings.workspace = true
telemetry.workspace = true
util.workspace = true
workspace.workspace = true

# The self dev-dependency keeps this crate's own `test-support` on whenever its
# test target is built. `diagnostics.rs` mirrors `livekit_client`'s
# `any(test, feature = "test-support")` switch to pick between the real `RtcStats`
# and the mock one; the dev-dependency below forces `livekit_client` to the mock,
# so without this line the two switches disagree and `cargo {test,clippy} -p call
# --all-targets` does not compile at all.
[dev-dependencies]
call = { workspace = true, features = ["test-support"] }
client = { workspace = true, features = ["test-support"] }
collections = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
util = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }

livekit_client = { workspace = true, features = ["test-support"] }
